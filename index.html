<!doctype html><html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest">
<title>Plan treningowy 4.0 — bez nóg</title>
<style>
body{margin:0;font-family:system-ui;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:16px}
main{max-width:850px;margin:auto;padding:12px}nav,.tools{display:flex;gap:6px;overflow:auto;padding:9px;background:white}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.tab{background:#e5e7eb}.active,.primary{background:#2563eb;color:white}
.card,.ex{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}
.exhead{display:flex;justify-content:space-between;gap:8px}.muted{color:#6b7280;font-size:13px}
.set{display:grid;grid-template-columns:32px 1fr 1fr;gap:7px;margin-top:8px;align-items:center}
input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}
input[type=checkbox]{width:22px;height:22px}.bar{height:9px;background:#16a34a;border-radius:9px;width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#f9fafb;padding:10px;border-radius:10px}
canvas{width:100%;height:210px;background:white;border:1px solid #e5e7eb;border-radius:10px}
.timer{font-size:42px;text-align:center;font-weight:900}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #e5e7eb;text-align:left}
</style></head><body>
<header><b>Plan treningowy 4.0 — bez nóg</b><div class="muted" style="color:#d1d5db">Góra ciała + core • bieganie 2×</div></header>
<nav id="days"></nav><div class="tools">
<button onclick="showHistory()">Historia</button><button onclick="showProgress()">Progres</button>
<button onclick="showMeasurements()">Pomiary</button><button onclick="showBackup()">Backup</button></div>
<main id="app"></main>
<script>
const PLAN={"Pon":{"title":"Siła A — klatka + plecy + ramiona","type":"strength","ex":[["Wyciskanie hantli na ławce","4×8–12"],["Wiosłowanie na wyciągu","4×8–12"],["Wyciskanie hantli na ławce skośnej","3×8–12"],["Ściąganie drążka wyciągu górnego","3×8–12"],["Unoszenie hantli bokiem","3×12–15"],["Prostowanie ramion na wyciągu","3×10–15"],["Uginanie hantli na biceps","3×10–15"],["Plank","3×45–60 s"]]},"Wt":{"title":"Bieg 1 — interwały","type":"run","desc":"10 min rozgrzewki → 6× (2 min szybko RPE 7–8 + 2 min lekko) → 5–10 min schłodzenia."},"Śr":{"title":"Siła B — plecy + barki + klatka","type":"strength","ex":[["Ściąganie drążka wyciągu górnego","4×8–12"],["Wyciskanie hantli siedząc","3×8–12"],["Wiosłowanie hantlem jednorącz","4×8–12"],["Rozpiętki na wyciągu","3×10–15"],["Face pull","3×12–15"],["Unoszenie hantli bokiem","3×12–20"],["Uginanie na biceps na wyciągu","3×10–15"],["Pallof press","3×10–15 / strona"]]},"Czw":{"title":"Odpoczynek","type":"rest","desc":"Regeneracja, spacer i mobilność według potrzeb."},"Pt":{"title":"Siła C — górna część ciała + core","type":"strength","ex":[["Wyciskanie hantli na ławce","4×8–12"],["Wiosłowanie na wyciągu","4×8–12"],["Wyciskanie hantli na ławce skośnej","3×8–12"],["Ściąganie drążka wyciągu górnego","3×8–12"],["Face pull","3×12–15"],["Unoszenie hantli bokiem","4×12–20"],["Biceps","3×10–15"],["Triceps na wyciągu","3×10–15"],["Unoszenie nóg","3×10–15"]]},"Sob":{"title":"Bieg 2 — spokojny","type":"run","desc":"40–55 min w tempie konwersacyjnym. Jeśli potrzeba: 8 min biegu + 1 min marszu × 5."}};
let S=JSON.parse(localStorage.getItem("t40upper")||"null")||{history:[],measurements:[],draft:{},day:"Pon"};
const days=["Pon","Wt","Śr","Czw","Pt","Sob"];
function save(){localStorage.setItem("t40upper",JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function last(n){for(let i=S.history.length-1;i>=0;i--){let e=S.history[i].exercises.find(x=>x.name===n);if(e)return e}}
function nav(){days.forEach(d=>{let b=document.createElement("button");b.textContent=d;b.className="tab "+(S.day===d?"active":"");b.onclick=()=>{S.day=d;save();render()};document.getElementById("days").appendChild(b)})}
function render(){document.getElementById("days").innerHTML="";nav();let p=PLAN[S.day],a=document.getElementById("app");
if(p.type==="rest"){a.innerHTML='<div class="card"><h2>Odpoczynek</h2><p>'+p.desc+'</p></div>';return}
if(p.type==="run"){a.innerHTML='<div class="card"><h2>'+p.title+'</h2><p>'+p.desc+'</p><button class="primary" onclick="timer(90)">⏱ 90 s</button></div>';return}
let k=today()+"_"+S.day,d=S.draft[k]||{},total=0,done=0;
a.innerHTML='<div class="card"><h2>'+p.title+'</h2><div class="bar" id="bar"></div><div id="exercises"></div><div class="row"><button class="primary" onclick="finish()">Zapisz trening</button><button onclick="timer(90)">⏱ Timer</button></div></div>';
let box=document.getElementById("exercises");
p.ex.forEach((x,ei)=>{let n=x[0],sets=parseInt(x[1])||3,lastE=last(n),el=document.createElement("div");el.className="ex";
el.innerHTML='<div class="exhead"><b>'+n+'</b><span class="muted">'+x[1]+'</span></div>';
for(let s=0;s<sets;s++){total++;let r=d[n]?.[s]||{},row=document.createElement("div");row.className="set";
row.innerHTML='<input type="checkbox" '+(r.done?"checked":"")+'><input inputmode="decimal" placeholder="'+(lastE?.sets?.[s]?.weight||"kg")+'" value="'+(r.weight||"")+'"><input inputmode="numeric" placeholder="powt." value="'+(r.reps||"")+'">';
let q=row.querySelectorAll("input");q[0].onchange=()=>upd(n,s,"done",q[0].checked);q[1].onchange=()=>upd(n,s,"weight",q[1].value);q[2].onchange=()=>upd(n,s,"reps",q[2].value);el.appendChild(row);if(r.done)done++}
if(lastE){let z=document.createElement("div");z.className="muted";z.textContent="Ostatnio: "+lastE.sets.map(q=>(q.weight||"—")+" kg × "+(q.reps||"—")).join(" • ");el.appendChild(z)}
box.appendChild(el)});document.getElementById("bar").style.width=(done/total*100)+"%"}
function upd(n,s,k,v){let key=today()+"_"+S.day;S.draft[key]??={};S.draft[key][n]??=[];S.draft[key][n][s]??={};S.draft[key][n][s][k]=v;save()}
function finish(){let key=today()+"_"+S.day,d=S.draft[key]||{},ex=Object.entries(d).map(([name,sets])=>({name,sets:sets.filter(Boolean)})).filter(x=>x.sets.length);
if(!ex.length)return alert("Uzupełnij przynajmniej jedną serię.");S.history.push({date:today(),day:S.day,title:PLAN[S.day].title,exercises:ex});delete S.draft[key];save();alert("Trening zapisany.");render()}
function showHistory(){app.innerHTML='<div class="card"><h2>Historia</h2>'+S.history.slice().reverse().map(w=>'<div class="ex"><b>'+w.date+' — '+w.title+'</b><div class="muted">'+w.exercises.map(e=>e.name+": "+e.sets.map(s=>(s.weight||"—")+"×"+(s.reps||"—")).join(", ")).join("<br>")+'</div></div>').join("")||'<p class="muted">Brak zapisów.</p></div>'}
function showProgress(){let m={};S.history.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>{let v=+s.weight||0;m[e.name]=Math.max(m[e.name]||0,v)})));app.innerHTML='<div class="card"><h2>Progres siłowy</h2>'+Object.entries(m).map(([n,v])=>'<div class="ex"><b>'+n+'</b><div class="muted">Najwyższy zapisany ciężar: '+v+' kg</div></div>').join("")||'<p class="muted">Zapisz treningi, aby zobaczyć progres.</p></div>'}
function showMeasurements(){app.innerHTML='<div class="card"><h2>Pomiary</h2><form id="mf" class="row"><input id="w" inputmode="decimal" placeholder="Masa (kg)"><input id="wa" inputmode="decimal" placeholder="Talia (cm)"><button class="primary">Dodaj</button></form></div><div class="card"><canvas id="chart"></canvas></div><div class="card"><table><tr><th>Data</th><th>kg</th><th>cm</th></tr>'+S.measurements.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td>'+(x.weight||"—")+'</td><td>'+(x.waist||"—")+'</td></tr>').join("")+'</table></div>';mf.onsubmit=e=>{e.preventDefault();S.measurements.push({date:today(),weight:w.value,waist:wa.value});save();showMeasurements()};draw()}
function draw(){let c=document.getElementById("chart");if(!c)return;let d=S.measurements.filter(x=>x.weight),ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=420;ctx.clearRect(0,0,c.width,c.height);if(!d.length)return;let v=d.map(x=>+x.weight),mi=Math.min(...v)-1,ma=Math.max(...v)+1;ctx.beginPath();d.forEach((x,i)=>{let X=30+i*(c.width-60)/Math.max(1,d.length-1),Y=c.height-30-(+x.weight-mi)/(ma-mi)*(c.height-60);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);ctx.fillText(x.weight,X-10,Y-8)});ctx.stroke()}
function showBackup(){app.innerHTML='<div class="card"><h2>Backup</h2><div class="row"><button class="primary" onclick="exportJSON()">Eksport JSON</button><label><input type="file" accept=".json" onchange="importJSON(event)"> Import JSON</label><button onclick="clearAll()">Usuń dane</button></div></div>'}
function exportJSON(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="trening-4-0-bez-nog-backup.json";a.click()}
function importJSON(e){let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert("Backup zaimportowany.")}catch{alert("Nieprawidłowy JSON.")}};r.readAsText(e.target.files[0])}
function clearAll(){if(confirm("Usunąć wszystkie dane?")){S={history:[],measurements:[],draft:{},day:"Pon"};save();render()}}
function timer(sec){let x=document.createElement("div");x.className="card";x.innerHTML='<div class="timer" id="tm">01:30</div><button onclick="this.parentElement.remove();clearInterval(t)">Zamknij</button>';app.prepend(x);let end=Date.now()+sec*1000;t=setInterval(()=>{let z=Math.max(0,Math.ceil((end-Date.now())/1000));tm.textContent=String(Math.floor(z/60)).padStart(2,"0")+":"+String(z%60).padStart(2,"0");if(!z)clearInterval(t)},200)}
let t;render();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
